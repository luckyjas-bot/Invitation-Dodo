<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cutest Dodo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fbd3d3; /* 图片中的底色 */
            color: #a64444; /* 图片中的深红文字颜色 */
            font-family: 'Great Vibes', 'Dancing Script', cursive;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰圆弧/心形 */
        .bg-decoration {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 0;
        }
        .bg-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }

        h1 {
            font-size: 5.5rem;
            margin: 0;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 2.2rem;
            font-weight: normal;
            margin-top: 10px;
            margin-bottom: 60px;
            z-index: 1;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            z-index: 1;
        }

        /* 爱心按钮通用样式 */
        .heart-btn {
            position: relative;
            width: 120px;
            height: 110px;
            cursor: pointer;
            border: none;
            background: none;
            outline: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-btn::before,
        .heart-btn::after {
            content: "";
            position: absolute;
            top: 0;
            width: 60px;
            height: 100px;
            border-radius: 60px 60px 0 0;
        }

        .heart-btn::before {
            left: 60px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-btn::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Yes 按钮样式：深红色 */
        #yesBtn::before, #yesBtn::after {
            background: #a64444;
        }

        /* No 按钮样式：白色 */
        #noBtn::before, #noBtn::after {
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-text {
            position: relative;
            z-index: 10;
            font-size: 1.8rem;
            font-family: 'Dancing Script', cursive;
        }

        #yesBtn .btn-text { color: #fbd3d3; }
        #noBtn .btn-text { color: #a64444; }

        #noBtn {
            position: absolute;
            left: 55%; /* 初始位置 */
        }
    </style>
</head>
<body onclick="playMusic()">

    <div class="bg-decoration bg-1"></div>
    <div class="bg-decoration bg-2"></div>

    <h1 id="mainTitle">My Cutest Dodo</h1>
    <h2 id="subTitle">Will you go out a date with me tomorrow?</h2>

    <div class="container">
        <button class="heart-btn" id="yesBtn" onclick="celebrate(event)">
            <span class="btn-text">Yes</span>
        </button>

        <button class="heart-btn" id="noBtn">
            <span class="btn-text">No</span>
        </button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.youtube.com/watch?v=450p7goxZqg">
    </audio>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const bgMusic = document.getElementById('bgMusic');

        let yesScale = 1;
        let musicStarted = false;

        // 播放音乐的函数
        function playMusic() {
            if (!musicStarted) {
                bgMusic.play().catch(e => console.log("等待交互播放音乐"));
                musicStarted = true;
            }
        }

        // No 按钮逃跑逻辑
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 110);

            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Yes 变大
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        // 点击 Yes 的效果
        function celebrate(event) {
            event.stopPropagation(); // 防止触发 body 的点击事件
            playMusic();
            
            mainTitle.innerText = "Love you forever!";
            subTitle.innerText = "See you on tonight! ❤️";
            
            noBtn.style.display = 'none';
            yesBtn.style.transform = 'scale(2)';
            yesBtn.style.transition = 'all 1s ease';
            
            document.body.style.backgroundColor = "#f7b7b7";
            
            alert("💖 Yeahhhh, my Dodo says yes! 💖");
        }
    </script>
</body>
</html>
